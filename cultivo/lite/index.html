<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07111a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CultivApp Lite">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<title>CultivApp Lite</title>
<link rel="stylesheet" href="lite.css">
<script type="module" src="lite.js"></script>
</head>
<body>

<header class="bar">
  <div class="bar-titulo"><span aria-hidden="true">🌿</span> CultivApp <small>Lite</small></div>
  <div class="bar-acciones">
    <button id="btn-seleccionar" class="chip-btn" type="button" aria-pressed="false">Seleccionar</button>
    <button id="btn-campo" class="icon-btn" type="button" aria-label="Cambiar entre modo oscuro y modo campo">🌓</button>
  </div>
</header>

<main class="main">
  <section id="vista-plantas" class="vista activa" aria-label="Plantas por ubicación"></section>
  <section id="vista-luces" class="vista" aria-label="Luces por lugar"></section>
</main>

<div id="barra-seleccion" class="barra-seleccion" hidden>
  <span id="sel-count">0 seleccionadas</span>
  <button id="btn-mover-sel" class="btn btn-primary" type="button">📍 Mover</button>
</div>

<nav class="tabs" role="navigation" aria-label="Navegación principal">
  <button class="tab activa" data-vista="vista-plantas" type="button"><span aria-hidden="true">🪴</span>Plantas</button>
  <button class="tab" data-vista="vista-luces" type="button"><span aria-hidden="true">💡</span>Luces</button>
</nav>

<!-- Hoja inferior reutilizable (mover plantas / cambiar luces) -->
<div id="overlay" class="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-titulo">
    <div class="sheet-grip" aria-hidden="true"></div>
    <h2 id="sheet-titulo"></h2>
    <div id="sheet-cuerpo"></div>
    <div class="sheet-pie">
      <button id="sheet-cancelar" class="btn" type="button">Cancelar</button>
      <button id="sheet-ok" class="btn btn-primary" type="button">Guardar</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<datalist id="lista-luces"></datalist>
</body>
</html>
